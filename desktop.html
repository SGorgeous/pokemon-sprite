<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokémonSprite 在线阅读器</title>
<style>
:root{--bg:#F4F7FB;--panel:#FFFFFF;--panel2:#EEF3F9;--line:#E2E9F2;--text:#31404F;
      --dim:#8B9AAD;--accent:#6BB3E6;--accent2:#F2994A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.5 "Microsoft YaHei UI","Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:236px 1fr;height:100vh}
#side{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side h1{font-size:13px;margin:0;padding:12px 14px 6px;color:var(--text);font-weight:700}
#side .hint{padding:0 14px 8px;color:var(--dim);font-size:11px;line-height:1.5}
#tree{overflow-y:auto;flex:1;padding:0 6px 14px}
.grp{margin:8px 6px 2px;color:var(--dim);font-size:11px}
.sub{padding:4px 9px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;
  gap:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub:hover{background:var(--panel2)}
.sub.on{background:var(--accent);color:#fff}
.sub .n{color:var(--dim);font-size:11px;flex:none}
.sub.on .n{color:#E8F4FD}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:4px;padding:8px 12px 0;background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
#tabs button{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--dim);
  padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
#tabs button:hover{color:var(--text);background:var(--panel2)}
#tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);flex-wrap:wrap;position:sticky;top:0;z-index:7}
#q{flex:1;min-width:200px;padding:7px 11px;border-radius:11px;border:1px solid var(--line);
  background:#F7FAFE;color:var(--text);font-size:13px;outline:none;font-family:inherit}
#q:focus{border-color:var(--accent)}
select,button.mini{background:#F7FAFE;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:6px 9px;font-size:12.5px;cursor:pointer;font-family:inherit}
button.mini:hover{border-color:var(--accent)}
button.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
#stat{color:var(--dim);font-size:11.5px;white-space:nowrap}
#content{flex:1;overflow:auto;min-height:0;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{border-color:#5a4a38}
.card .box{height:86px;display:flex;align-items:center;justify-content:center;background:#FBFDFF}
.card img{max-width:100%;max-height:100%;image-rendering:pixelated;opacity:0;transition:opacity .18s}
.card img.ok{opacity:1}
.card .cap{font-size:10.5px;color:var(--text);padding:4px 6px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center}
.card .cap b{color:var(--text);font-weight:500}
#more{display:block;margin:16px auto;padding:8px 22px}
.pmd{display:none;flex-direction:column;flex:1;min-height:0}
.pmd.on{display:flex}
#pmdBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#pmdBar label{color:var(--dim);font-size:11.5px}
#stageP{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0;
  background-color:#0d1117;background-image:
  linear-gradient(45deg,#161b22 25%,transparent 25%,transparent 75%,#161b22 75%),
  linear-gradient(45deg,#161b22 25%,transparent 25%,transparent 75%,#161b22 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
#cvP{image-rendering:pixelated;display:block}
#stripP{padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);display:none;
  align-items:center;gap:10px;overflow-x:auto}
#stripP.on{display:flex}
#cv8{image-rendering:pixelated}
#pmdStat{padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:11.5px;display:flex;gap:16px;flex-wrap:wrap}
#pmdStat b{color:var(--text)}
#lb{position:fixed;inset:0;background:rgba(244,247,251,.96);-webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);z-index:99;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:22px}
#lb.on{display:flex}
#lb .stage img{image-rendering:pixelated;min-width:96px;max-height:50vh;background:
  repeating-conic-gradient(#1b2029 0 25%,#141920 0 50%) 0 0/18px 18px;border-radius:8px;padding:10px}
#lb .cap{color:var(--dim);font-size:12px}
#lb .stage{background:#F7FAFE}
#lb .cap b{color:var(--text)}
#lb .strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-content:flex-start;
  width:92vw;max-height:42vh;overflow:auto}
#lb .strip figure{margin:0;text-align:center}
#lb .strip img{max-height:72px;image-rendering:pixelated}
#lb .strip figcaption{font-size:10px;color:var(--dim)}
.err{color:#ff7b72}
.spin{color:var(--dim);padding:20px}
.note{color:var(--dim);font-size:12px;line-height:1.8;max-width:640px}
.star{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--accent2);
  font-size:14px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.card:hover .star{display:flex}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>PokémonSprite 在线</h1>
    <div class="hint" id="sideHint">载入中…</div>
    <div id="tree"></div>
  </aside>
  <main id="main">
    <div id="tabs">
      <button data-m="showdown" class="on">Showdown</button>
      <button data-m="pmd">PMD 动画</button>
      <button data-m="official">官方立绘</button>
      <button data-m="cafe" id="tabCafe" style="display:none">Café ReMix</button>
      <button data-m="about">说明</button>
    </div>
    <div id="bar">
      <input id="q" placeholder="搜索名字（跨全部系列）…  例 pikachu / charizard-mega" autocomplete="off">
      <span id="stat"></span>
      <button class="mini" id="btnCross" title="显示该名字在所有系列里的版本">全系列</button>
      <button class="mini" id="btnCdn" title="切换图片源">源: ghproxy</button>
<button class="mini" id="btnLang" title="卡片名字用中文还是英文">中文</button>
<button class="mini" id="btnFav" title="只看收藏">收藏 <b id="favN">0</b></button>
<button class="mini" id="btnSel" title="多选后批量下载">多选</button>
    </div>
    <div id="content"><div class="spin">载入中…</div></div>
    <div class="pmd" id="pmdWrap">
      <div id="pmdBar">
        <label>形态</label><select id="form"><option value="">基础形态</option></select>
        <label>动作</label><select id="action"></select>
        <label>朝向</label><select id="dir"></select>
        <button class="mini on" id="play">暂停</button>
        <label>速度</label><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1">
        <span id="speedVal" style="color:var(--dim)">1x</span>
        <label>缩放</label><input id="zoom" type="range" min="1" max="8" step="1" value="4">
        <span id="zoomVal" style="color:var(--dim)">4x</span>
        <button class="mini" id="shadow">影子</button>
        <button class="mini" id="eight">8向</button>
      </div>
      <div id="stageP"><canvas id="cvP" width="256" height="224"></canvas></div>
      <div id="stripP"><span style="color:var(--dim)">8 向：</span><canvas id="cv8"></canvas></div>
      <div id="pmdStat">
        <span>宝可梦 <b id="pName">—</b></span>
        <span>帧 <b id="pFrame">—</b></span>
        <span>尺寸 <b id="pSize">—</b></span>
        <span>动作 <b id="pActs">—</b></span>
        <span>空格 播放　←→ 朝向　↑↓ 动作</span>
      </div>
    </div>
  </main>
</div>
<div id="lb"><div class="stage"><img id="lbImg" alt=""></div>
  <div class="cap" id="lbCap"></div><div class="strip" id="lbStrip"></div></div>

<script>
"use strict";
const el = id => document.getElementById(id);
const S = {
  mode:"showdown", sub:null, query:"", cross:false,
  subs:[], groups:[], nameMap:{}, subIds:[], subCache:{},
  pmd:[], pmdCur:null, official:[], offKind:"official-artwork", offShiny:false,
  cafe:[], cafeOk:false, cafeGroup:"",
  cdn:"ghproxy",
  lang: "zh",              // zh | en
  zh: {},                  // { 中文名: id } 原始表
  zhById: null,            // Map: id -> 中文名
  terms: [],               // 搜索分词
  fav: [],                 // 收藏的 URL
  favOnly: false,
  sel: [],                 // 多选中的 URL
  selMode: false,
};

/* ---------------- 语言 / 本地存储 ---------------- */
function loadPrefs(){
  try{
    S.lang = localStorage.getItem("lang") || "zh";   // 和手机端共用同一个键
    S.fav  = JSON.parse(localStorage.getItem("pp.fav") || "[]");
  }catch(e){ S.fav = []; }
}
function savePrefs(){
  try{
    localStorage.setItem("lang", S.lang);
    localStorage.setItem("pp.fav", JSON.stringify(S.fav));
  }catch(e){}
}

/* ---- 以下整段照搬手机端，别各写一套 ---- */
function buildNameIndex(){
  // zh.json: { 中文名: showdownId }  → 反过来 id → 中文
  S.zhById = new Map();
  for(const zh in (S.zh || {})){
    const id = String(S.zh[zh]).replace(/\s+/g, '-').toLowerCase();
    S.zhById.set(id, zh);
  }
}
function titleCase(id){
  return String(id || '').split('-').map((w, i) =>
    i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w
  ).join(' ');
}

/* ---- 形态译名 ----
    -mega / -megax / -megay  → 超级XX / 超级XX X / 超级XX Y
    -gmax                    → 超极巨XX
    -alola/-galar/-hisui/…   → XX（阿罗拉的样子）
    -f/-m                    → XX♀ / XX♂
   拼不出来的后缀忽略，只译宝可梦名。 */
const PREFIX_FORM = {
  mega:'超级', megax:'超级', megay:'超级',
  primal:'原始', gmax:'超极巨',
};
const REGION_FORM = {
  alola:'阿罗拉', galar:'伽勒尔', hisui:'洗翠', paldea:'帕底亚',
  alolatotem:'阿罗拉', galartotem:'伽勒尔',
};
const SEX_FORM = { f:'♀', m:'♂' };
const MARK_FORM = {
  totem:'霸主', origin:'起源', therian:'灵兽', sky:'天空', land:'化身',
  white:'白', black:'黑', resolute:'觉悟', pirouette:'舞步', blade:'刀剑', shield:'盾牌',
  zen:'达摩', complete:'完全', unbound:'解放', eternal:'永恒', ash:'小智版',
};

function zhBase(key){
  if(!S.zhById) return null;
  if(S.zhById.has(key)) return S.zhById.get(key);
  const parts = key.split('-');
  while(parts.length > 1){
    parts.pop();
    const b = parts.join('-');
    if(S.zhById.has(b)) return S.zhById.get(b);
  }
  return null;
}

/* 逗号（全角/半角）分隔多个关键词；任一命中就算匹配 */
function parseTerms(text){
  return String(text || '')
    .split(/[,，]/)
    .map(t => t.trim().toLowerCase())
    .filter(Boolean);
}
function nameMatches(name){
  if(!S.terms || !S.terms.length) return true;
  const raw = String(name || '').toLowerCase();
  const zh = zhNameOf(name).toLowerCase();
  return S.terms.some(t => raw.includes(t) || zh.includes(t));
}

function zhNameOf(idOrName){
  const raw = String(idOrName || '');
  if(!raw) return '';
  const key = raw.toLowerCase().replace(/\s+/g, '-');
  let zh = zhBase(key);
  // 「Alolan Exeggutor」这类以地区开头的英文名
  if(!zh){
    const REGION_EN = { alolan:'阿罗拉', galarian:'伽勒尔', hisuian:'洗翠',
                        paldean:'帕底亚', alola:'阿罗拉', galar:'伽勒尔' };
    const words = raw.split(/\s+/);
    if(words.length > 1){
      const rg = REGION_EN[words[0].toLowerCase()];
      if(rg){
        const rest = zhBase(words.slice(1).join('-').toLowerCase());
        if(rest) return `${rest}（${rg}的样子）`;
      }
    }
  }
  if(!zh) return titleCase(raw);

  const parts = key.split('-');
  const suffix = parts.slice(1);
  let prefix = '', region = '', sex = '', extra = [], marks = '';
  for(const t of suffix){
    if(PREFIX_FORM[t] && !prefix){
      prefix = PREFIX_FORM[t];
      if(t === 'megax') marks += 'X';
      if(t === 'megay') marks += 'Y';
    } else if(REGION_FORM[t] && !region){
      region = REGION_FORM[t];
    } else if(SEX_FORM[t]){
      sex = SEX_FORM[t];
    } else if(MARK_FORM[t]){
      extra.push(MARK_FORM[t] + '形态');
    }
  }
  let out = (prefix || '') + zh + sex + marks;
  if(!region && !extra.length) return out;
  return out + '（' + [region ? region + '的样子' : '', extra.join('·')].filter(Boolean).join('·') + '）';
}

/** 卡片上显示的名字：英文环境 titleCase，中文环境走 zhNameOf */
function dispName(idOrName){
  const raw = String(idOrName || '');
  if(!raw) return '';
  if((localStorage.getItem('lang') || 'zh') === 'en') return titleCase(raw);
  return zhNameOf(raw);
}
function setLang(l){
  S.lang = l;
  localStorage.setItem('lang', l);
}

function isFav(url){ return S.fav.indexOf(url) >= 0; }
function toggleFav(url){
  const i = S.fav.indexOf(url);
  if(i >= 0) S.fav.splice(i, 1); else S.fav.push(url);
  savePrefs(); updFavN();
}
function updFavN(){ const b = el("favN"); if(b) b.textContent = S.fav.length; }
function isSel(url){ return S.sel.indexOf(url) >= 0; }
function toggleSel(url){
  const i = S.sel.indexOf(url);
  if(i >= 0) S.sel.splice(i, 1); else S.sel.push(url);
  updSelBar();
}
function updSelBar(){
  let bar = el("selBar");
  if(!S.selMode){ if(bar) bar.style.display = "none"; return; }
  if(!bar){
    bar = document.createElement("div"); bar.id = "selBar";
    bar.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;" +
      "display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:14px;" +
      "background:rgba(255,255,255,.94);backdrop-filter:blur(16px);" +
      "box-shadow:0 8px 26px rgba(120,150,190,.28);border:1px solid var(--line)";
    document.body.appendChild(bar);
  }
  bar.style.display = "flex";
  bar.innerHTML = `<span style="color:var(--dim)">已选 <b style="color:var(--accent)">${S.sel.length}</b></span>`;
  const d = document.createElement("button"); d.className = "mini"; d.textContent = "下载选中";
  d.onclick = () => {
    for(const u of S.sel){
      const a = document.createElement("a"); a.href = u; a.download = ""; a.target = "_blank";
      document.body.appendChild(a); a.click(); a.remove();
    }
  };
  const c = document.createElement("button"); c.className = "mini"; c.textContent = "清空";
  c.onclick = () => { S.sel = []; updSelBar(); render(); };
  bar.appendChild(d); bar.appendChild(c);
}

const CDN = {
  // 前缀代理：raw.githubusercontent.com 在国内常「挂起」，jsDelivr 又只是 301 回 raw，
  // 只有这类代理真的能取到内容。
  ghproxy: {
    label: "ghproxy",
    sd: "https://play.pokemonshowdown.com/sprites/",
    pmd: "https://ghproxy.net/https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/",
    pk:  "https://ghproxy.net/https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/",
  },
  ghproxy2: {
    label: "gh-proxy",
    sd: "https://play.pokemonshowdown.com/sprites/",
    pmd: "https://gh-proxy.com/https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/",
    pk:  "https://gh-proxy.com/https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/",
  },
  raw: {
    label: "GitHub raw",
    sd: "https://play.pokemonshowdown.com/sprites/",        // Showdown 自己就是 CDN，不参与切换
    pmd: "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/",
    pk:  "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/",
  },
  jsd: {
    label: "jsDelivr(fastly)",
    sd: "https://play.pokemonshowdown.com/sprites/",
    pmd: "https://fastly.jsdelivr.net/gh/PMDCollab/SpriteCollab@master/sprite/",
    pk:  "https://fastly.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/",
  },
};
const C = () => CDN[S.cdn];
const sprites = {
  showdown: (sub, name, ext) => C().sd + sub + "/" + encodeURIComponent(name) + ext,
  pmd: (dex, path, action, kind) =>
    C().pmd + dex + "/" + (path ? path + "/" : "") + encodeURIComponent(action + "-" + kind + ".png"),
  pmdXml: (dex, path) => C().pmd + dex + "/" + (path ? path + "/" : "") + "AnimData.xml",
  offArt: (id) => C().pk + S.offKind + "/" + (S.offShiny ? "shiny/" : "") + id + ".png",
};

/* ---------------- boot ---------------- */
init();
async function init(){
  try{
    const D = window.__DATA__;
    const [subs, names, pmd, off] = D
      ? [D.subs, D.names, D.pmd, D.official]
      : await Promise.all([
          fetch("data/subs.json").then(r=>r.json()),
          fetch("data/names.json").then(r=>r.json()),
          fetch("data/pmd.json").then(r=>r.json()),
          fetch("data/official.json").then(r=>r.json()),
        ]);
    S.subs = subs.subs; S.groups = subs.groups;
    S.nameMap = names.map; S.subIds = names.subs;
    S.pmd = pmd; S.official = off;
    loadPrefs();
    try{
      S.zh = D && D.zh ? D.zh : await fetch("data/zh.json").then(r=>r.json());
    }catch(e){ S.zh = {}; }
    buildNameIndex();
    el("btnLang").textContent = S.lang === "zh" ? "中文" : "EN";
    el("btnLang").classList.toggle("on", S.lang === "zh");
    updFavN();
    S.sub = S.subs.find(s=>s.id==="ani") ? "ani" : S.subs[0].id;
    bind(); buildTree();
    await probeCafe();
    el("sideHint").textContent =
      `${S.subs.length} 组 · ${Object.keys(S.nameMap).length} 个名字 · ` +
      `PMD ${S.pmd.length} 只 · 立绘 ${S.official.length}`;
    render();
  }catch(e){
    el("content").innerHTML = '<div class="spin err">载入失败：'+e.message+
      '<br>请用 start-online.ps1 起个本地服务（file:// 下 fetch 会被拦）</div>';
  }
}

function bind(){
  el("tabs").addEventListener("click", e=>{
    const b=e.target.closest("button[data-m]"); if(!b) return;
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
    setMode(b.dataset.m);
  });
  let t=0;
  el("q").addEventListener("input", e=>{ clearTimeout(t); t=setTimeout(()=>{
    S.query = e.target.value.trim().toLowerCase();
    if(S.mode==="pmd") filterPmd(S.query); else render();
  },120); });
  el("btnCross").onclick=()=>{ S.cross=!S.cross; el("btnCross").classList.toggle("on",S.cross); render(); };
  el("btnCdn").onclick=()=>{
    const keys = Object.keys(CDN);
    S.cdn = keys[(keys.indexOf(S.cdn) + 1) % keys.length];
    el("btnCdn").textContent = "源: " + C().label;
    render();
  };
  el("btnLang").onclick=()=>{
    setLang(S.lang === "zh" ? "en" : "zh");
    el("btnLang").textContent = S.lang === "zh" ? "中文" : "EN";
    el("btnLang").classList.toggle("on", S.lang === "zh");
    render();
  };
  el("btnFav").onclick=()=>{
    S.favOnly = !S.favOnly;
    el("btnFav").classList.toggle("on", S.favOnly);
    render();
  };
  el("btnSel").onclick=()=>{
    S.selMode = !S.selMode;
    el("btnSel").classList.toggle("on", S.selMode);
    if(!S.selMode) S.sel = [];
    updSelBar(); render();
  };
  el("lb").onclick=()=>el("lb").classList.remove("on");
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape") el("lb").classList.remove("on");
    if(e.key==="/" && document.activeElement!==el("q")){ e.preventDefault(); el("q").focus(); }
  });
  el("form").addEventListener("change", pmdLoadForm);
  el("action").addEventListener("change", pmdLoadAction);
  el("play").onclick=()=>{ P.playing=!P.playing; el("play").classList.toggle("on",P.playing);
    el("play").textContent=P.playing?"暂停":"播放"; };
  el("dir").onchange=e=>{ P.dir=+e.target.value; P.frame=0; P.acc=0; pmdDraw(); pmdStat(); pmdStrip(); };
  el("speed").oninput=e=>{ P.speed=+e.target.value; el("speedVal").textContent=P.speed+"x"; };
  el("zoom").oninput=e=>{ P.zoom=+e.target.value; el("zoomVal").textContent=P.zoom+"x"; pmdDraw(); };
  el("shadow").onclick=()=>{ P.shadow=!P.shadow; el("shadow").classList.toggle("on",P.shadow); pmdLoadAction(); };
  el("eight").onclick=()=>{ P.eight=!P.eight; el("eight").classList.toggle("on",P.eight);
    el("stripP").classList.toggle("on",P.eight); pmdStrip(); };
  document.addEventListener("keydown", e=>{
    if(S.mode!=="pmd"||["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
    if(e.code==="Space"){ e.preventDefault(); el("play").click(); }
    else if(e.code==="ArrowLeft"||e.code==="ArrowRight"){
      P.dir=(P.dir+(e.code==="ArrowRight"?1:7))%8; el("dir").value=P.dir;
      P.frame=0; pmdDraw(); pmdStat(); pmdStrip(); }
    else if(e.code==="ArrowUp"||e.code==="ArrowDown"){
      const a=el("action"); let i=a.selectedIndex+(e.code==="ArrowDown"?1:-1);
      i=(i+a.length)%a.length; a.selectedIndex=i; pmdLoadAction(); }
  });
}

function setMode(m){
  S.mode=m; S.query=""; el("q").value="";
  el("pmdWrap").classList.toggle("on", m==="pmd");
  el("content").style.display = m==="pmd" ? "none" : "";
  el("bar").style.display = m==="about" ? "none" : "";
  if(m==="showdown"){ buildTree(); render(); el("q").placeholder="搜索名字（跨全部系列）…"; }
  else if(m==="pmd"){ buildPmdTree(); }
  else if(m==="official"){ buildOffTree(); render(); }
  else if(m==="cafe"){ buildCafeTree(); render(); }
  else if(m==="about"){ renderAbout(); }
}

/* ---------------- showdown ---------------- */
function buildTree(){
  const tree=el("tree"); tree.innerHTML="";
  for(const g of S.groups){
    const h=document.createElement("div"); h.className="grp"; h.textContent=g.title; tree.appendChild(h);
    for(const id of g.subs){
      const s=S.subs.find(x=>x.id===id); if(!s) continue;
      const d=document.createElement("div"); d.className="sub"+(id===S.sub?" on":"");
      d.dataset.sub=id;
      d.innerHTML=`<span>${id}</span><span class="n">${s.count}</span>`;
      d.title=s.label;
      d.onclick=()=>{ S.sub=id;
        document.querySelectorAll(".sub").forEach(x=>x.classList.toggle("on",x.dataset.sub===id));
        render(); };
      tree.appendChild(d);
    }
  }
}

function subList(id){
  const D = window.__DATA__;
  if(!S.subCache[id]){
    S.subCache[id] = (D && D.showdown && D.showdown[id])
      ? Promise.resolve(D.showdown[id])
      : fetch("data/showdown/"+id+".json").then(r=>r.json());
  }
  return S.subCache[id];
}

function render(){
  if(S.mode==="pmd"||S.mode==="about") return;
  const c=el("content"); c.innerHTML="";
  if(S.mode==="showdown") return renderShowdown(c);
  if(S.mode==="official") return renderOfficial(c);
  if(S.mode==="cafe") return renderCafe(c);
}

let shown=200;
async function renderShowdown(c){
  if(!S.query){
    const list = await subList(S.sub);
    shown = 200;
    drawSdGrid(c, list.map(n=>[n, S.sub]));
    el("stat").textContent = `${S.sub} · ${list.length} 个文件`;
    return;
  }
  const subs = S.cross ? S.subIds : [S.sub];
  const subIdx = S.subIds.indexOf(S.sub);
  S.terms = parseTerms(S.query);
  let names = Object.keys(S.nameMap).filter(n => nameMatches(n));
  const items=[];
  for(const n of names){
    const where = S.nameMap[n];
    const pick = S.cross ? where.map(i=>S.subIds[i]) : (where.includes(subIdx)?[S.sub]:where.map(i=>S.subIds[i]));
    items.push([n, pick[0], pick]);
  }
  shown = 200;
  drawSdGrid(c, items, true);
  el("stat").textContent = `${names.length} 个名字匹配`;
}

function drawSdGrid(c, items, multi=false){
  if(S.favOnly){
    items = items.filter(it=>{
      const s = S.subs.find(x=>x.id===(it[1]||S.sub)) || S.subs[0];
      return isFav(sprites.showdown(it[1]||S.sub, it[0], s.ext));
    });
    if(!items.length){
      c.innerHTML = '<div class="spin">还没有收藏。鼠标移到卡片上点 ☆ 收藏。</div>';
      return;
    }
  }
  const g=document.createElement("div"); g.className="grid";
  for(const it of items.slice(0, shown)){
    const [name, sub, alts] = it;
    const s = S.subs.find(x=>x.id===sub) || S.subs[0];
    const img=document.createElement("img");
    img.loading="lazy";
    img.onload=()=>img.classList.add("ok");
    const urls = (alts&&alts.length?alts:[sub]).map(sb=>sprites.showdown(sb,name,S.subs.find(x=>x.id===sb).ext));
    let k=0;
    img.onerror=()=>{ img.onerror=null; if(++k<urls.length) img.src=urls[k];
      else { const p=img.parentElement; if(p) p.innerHTML='<span style="color:#5b6675;font-size:10px">无图</span>'; } };
    img.src=urls[0];
    const cd=document.createElement("div"); cd.className="card";
    const url0 = urls[0];
    if(isSel(url0)) cd.classList.add("sel");
    const label = dispName(name);
    cd.innerHTML=`<div class="box"></div><div class="cap"><b>${label}</b>`+
      (multi?`<br><span style="color:var(--dim)">${(alts||[]).length} 个系列</span>`:"")+`</div>`+
      `<button class="star" title="收藏">${isFav(url0)?"★":"☆"}</button>`;
    cd.querySelector(".box").appendChild(img);
    const star = cd.querySelector(".star");
    star.onclick = (e)=>{ e.stopPropagation(); toggleFav(url0); render(); };
    cd.onclick=()=>{
      if(S.selMode){ toggleSel(url0); cd.classList.toggle("sel", isSel(url0)); return; }
      openLB(name);
    };
    g.appendChild(cd);
  }
  c.appendChild(g);
  if(items.length > shown){
    const b=document.createElement("button"); b.className="mini"; b.id="more";
    b.textContent=`显示更多（还有 ${items.length-shown} 张）`;
    b.onclick=()=>{ shown+=200; c.innerHTML=""; drawSdGrid(c, items, multi); };
    c.appendChild(b);
  }
}

function openLB(name){
  const subs = S.nameMap[name] || [];
  el("lbImg").onerror=null;
  const first = subs.length ? S.subIds[subs[0]] : S.sub;
  const alts=[];
  for(const i of subs){
    const sb=S.subIds[i], s=S.subs.find(x=>x.id===sb);
    alts.push(sprites.showdown(sb,name,s.ext));
  }
  if(!alts.length) alts.push(sprites.showdown(S.sub,name,S.subs.find(x=>x.id===S.sub).ext));
  let k=0;
  el("lbImg").onerror=()=>{ el("lbImg").onerror=null; if(++k<alts.length) el("lbImg").src=alts[k]; };
  el("lbImg").src=alts[0];
  el("lbCap").innerHTML=`<b>${name}</b> · ${subs.length} 个系列有这张`;
  const strip=el("lbStrip"); strip.innerHTML="";
  for(const i of subs){
    const sb=S.subIds[i], s=S.subs.find(x=>x.id===sb);
    const f=document.createElement("figure");
    const im=document.createElement("img"); im.loading="lazy"; im.src=sprites.showdown(sb,name,s.ext);
    im.title=sb; im.style.cursor="zoom-in";
    im.onclick=ev=>{ ev.stopPropagation(); el("lbImg").src=im.src; };
    const fc=document.createElement("figcaption"); fc.textContent=sb;
    f.appendChild(im); f.appendChild(fc); strip.appendChild(f);
  }
  el("lb").classList.add("on");
}

/* ---------------- PMD ---------------- */
const P={cur:null,forms:[],actions:[],action:null,anim:null,shadow:null,frame:0,acc:0,last:0,
  playing:true,speed:1,zoom:4,dir:0,eight:false,shadowOn:false,req:0};
const PDIRS=["下","右下","右","右上","上","左上","左","左下"];
Object.defineProperty(P,"showShadow",{get(){return this.shadowOn;}});
P.shadow = false;

function buildPmdTree(){
  const tree=el("tree"); tree.innerHTML="";
  const h=document.createElement("div"); h.className="grp";
  h.textContent=`不可思议迷宫 · ${S.pmd.length}`; tree.appendChild(h);
  for(const m of S.pmd){
    const d=document.createElement("div"); d.className="sub"+(m.dex===P.cur?" on":"");
    d.dataset.dex=m.dex; d.dataset.name=m.name.toLowerCase();
    d.innerHTML=`<span>${m.name.replace(/_$/,"")}</span><span class="n">${m.dex}</span>`;
    d.onclick=()=>pmdSelect(m);
    tree.appendChild(d);
  }
  el("sideHint").textContent=`PMD · ${S.pmd.length} 只宝可梦`;
  const ds=el("dir"); ds.innerHTML="";
  PDIRS.forEach((x,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=i+" · "+x; ds.appendChild(o); });
  if(!P.cur) pmdSelect(S.pmd.find(m=>m.name==="Lucario") || S.pmd[0]);
  requestAnimationFrame(pmdLoop);
}

function filterPmd(q){
  let n=0;
  document.querySelectorAll("#tree .sub").forEach(d=>{
    const ok = !q || d.dataset.name.includes(q) || d.dataset.dex.includes(q);
    d.style.display = ok?"":"none"; if(ok) n++;
  });
  el("sideHint").textContent = q ? `PMD · ${n} 个匹配` : `PMD · ${S.pmd.length} 只宝可梦`;
}

async function pmdSelect(m){
  P.cur=m;
  document.querySelectorAll("#tree .sub").forEach(x=>x.classList.toggle("on", x.dataset.dex===m.dex));
  const fs=el("form"); fs.innerHTML="";
  for(const [i,f] of m.forms.entries()){
    const o=document.createElement("option"); o.value=i; o.textContent=f.n || "基础形态";
    fs.appendChild(o);
  }
  fs.value = 0;
  el("pName").textContent = `${m.name} (${m.dex})`;
  await pmdLoadForm();
}

function curForm(){ const m=P.cur; return m ? m.forms[+el("form").value] : null; }

async function pmdLoadForm(){
  const m=P.cur, f=curForm(); if(!m||!f) return;
  let xml;
  try{
    const r = await fetch(sprites.pmdXml(m.dex, f.p));
    if(!r.ok) throw new Error(r.status);
    xml = await r.text();
  }catch(e){
    P.actions=[]; P.action=null; el("action").innerHTML=""; el("pActs").textContent="0";
    el("pFrame").innerHTML='<span class="err">该形态没有动作数据</span>';
    const cv=el("cvP"); cv.width=1; cv.height=1; return;
  }
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const txt=(n,t)=>{ const e=n.querySelector(t); return e?e.textContent.trim():""; };
  P.actions=[...doc.querySelectorAll("Anims > Anim")].map(a=>({
    name: txt(a,"Name"),
    fw: +txt(a,"FrameWidth"), fh: +txt(a,"FrameHeight"),
    durations: [...a.querySelectorAll("Durations > Duration")].map(d=>+d.textContent)
  })).filter(a=>a.fw>0 && a.fh>0);
  const as=el("action"); as.innerHTML="";
  P.actions.forEach((a,i)=>{ const o=document.createElement("option"); o.value=i;
    o.textContent=`${a.name}  (${a.durations.length}帧)`; as.appendChild(o); });
  el("pActs").textContent=P.actions.length;
  if(P.actions.length){
    let i=P.actions.findIndex(a=>a.name==="Idle"); as.value = i>=0?i:0;
    await pmdLoadAction();
  }
}

function pimg(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i);
    i.onerror=()=>rej(new Error(src)); i.src=src; });
}

async function pmdLoadAction(){
  const m=P.cur, f=curForm(), a=P.actions[+el("action").value];
  if(!m||!f||!a) return;
  const token=++P.req; P.action=a; P.frame=0; P.acc=0;
  try{
    const jobs=[pimg(sprites.pmd(m.dex,f.p,a.name,"Anim"))];
    jobs.push(P.shadowOn ? pimg(sprites.pmd(m.dex,f.p,a.name,"Shadow")).catch(()=>null) : null);
    const [anim,shadow]=await Promise.all(jobs);
    if(token!==P.req) return;
    P.anim=anim; P.shadow=shadow; pmdDraw(); pmdStat(); pmdStrip();
  }catch(e){
    P.anim=null;
    el("pFrame").innerHTML='<span class="err">缺少 '+a.name+'-Anim.png</span>';
  }
}

function pmdDraw(){
  const a=P.action, cv=el("cvP"), ctx=cv.getContext("2d");
  if(!a||!P.anim){ cv.width=1; cv.height=1; return; }
  const w=a.fw*P.zoom, h=a.fh*P.zoom; cv.width=w; cv.height=h;
  ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,w,h);
  if(P.shadowOn && P.shadow){ ctx.globalAlpha=.45;
    ctx.drawImage(P.shadow, P.frame*a.fw, P.dir*a.fh, a.fw, a.fh, 0,0,w,h); ctx.globalAlpha=1; }
  ctx.drawImage(P.anim, P.frame*a.fw, P.dir*a.fh, a.fw, a.fh, 0,0,w,h);
}

function pmdStrip(){
  const cv=el("cv8"), ctx=cv.getContext("2d"), a=P.action;
  if(!P.eight||!P.anim||!a){ cv.width=1; cv.height=1; return; }
  const z=Math.max(1,Math.min(3,Math.floor(96/a.fh))), w=a.fw*z, h=a.fh*z;
  cv.width=w*8+7*6; cv.height=h; ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let d=0;d<8;d++){ const x=d*(w+6);
    if(d===P.dir){ ctx.fillStyle="#24405f"; ctx.fillRect(x-2,-2,w+4,h+4); }
    ctx.drawImage(P.anim, 0, d*a.fh, a.fw, a.fh, x,0,w,h); }
}

function pmdStat(){
  const a=P.action; if(!a) return;
  el("pFrame").textContent=`${P.frame+1}/${a.durations.length} · ${PDIRS[P.dir]}`;
  el("pSize").textContent=`${a.fw}×${a.fh}`;
}

function pmdLoop(t){
  requestAnimationFrame(pmdLoop);
  const a=P.action; if(!a||!P.anim) return;
  const dt=P.last?(t-P.last)/1000:0; P.last=t;
  if(!P.playing) return;
  let ch=false; P.acc+=dt*60*P.speed; let g=0;
  while(P.acc>=(a.durations[P.frame]??1) && g++<60){
    P.acc-=(a.durations[P.frame]??1); P.frame=(P.frame+1)%a.durations.length; ch=true;
  }
  if(ch){ pmdDraw(); pmdStat(); }
}

  el("content").innerHTML = `
