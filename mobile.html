<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12161c">
<title>PokePic</title>
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --panel2:#eef3f9; --line:#e2e9f2;
  --fg:#31404f; --text:#31404f; --dim:#8b9aad;
  --acc:#6bb3e6; --acc2:#f3a0c0; --danger:#ef7c7c;
  --shadow:0 2px 10px rgba(120,150,190,.10);
  --nav:0px; --gr:3; --fab:76px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"HarmonyOS Sans","Microsoft YaHei UI",system-ui,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- 顶栏 ---------- */
header{flex:none;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 8px) 10px 8px;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(120,150,190,.06)}
#q{flex:1;min-width:0;background:var(--panel2);border:1px solid transparent;border-radius:20px;
  color:var(--fg);font-size:15px;padding:9px 12px;outline:none;font-family:inherit}
#q:focus{border-color:var(--acc);background:#fff}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-size:16px;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.iconbtn:active{background:#dfe8f3}
#btnMode{font-size:12px;width:auto;padding:0 10px;color:var(--dim)}

/* ---------- 内容 ---------- */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav) + var(--safe-b) + 12px);display:none}
.view.on{display:block}

/* chips */
.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;
  overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);
  font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(107,179,230,.35)}

/* 网格 */
.grid{display:grid;grid-template-columns:repeat(var(--gr),1fr);gap:8px;padding:10px 12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;cursor:pointer}
.card .box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f7fafd;
  overflow:hidden}
.card img{max-width:100%;max-height:100%;image-rendering:pixelated;opacity:0;transition:opacity .15s}
.card img.ok{opacity:1}
.card .cap{font-size:10.5px;color:var(--dim);padding:3px 6px 5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center;line-height:1.25}
.card .cap{color:var(--dim)}
.card .cap b{color:var(--fg);font-weight:600}
.card.sel{outline:2px solid var(--acc);outline-offset:-2px}
.card .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;
  border:2px solid #ffffff90;background:#0009;display:none;align-items:center;justify-content:center;
  font-size:13px;color:#fff}
.card .tick.on{background:var(--acc);border-color:var(--acc)}
.card.sel .tick{display:flex}
#moreBtn{display:block;margin:6px auto 20px;padding:10px 26px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-size:13px}

/* 列表（PMD / 设置） */
.rows{padding:6px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;
  border-bottom:1px solid var(--line);font-size:14.5px}
.row:active{background:#eef3f9}
.row .sub{color:var(--dim);font-size:12px}
.row .val{color:var(--dim);font-size:12.5px}

/* PMD 播放器 */
#pmdTop{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
#pmdTop select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13px;font-family:inherit}
#pmdCanvasWrap{flex:none;height:min(42vh,320px);min-height:180px;margin:10px;
  display:flex;align-items:center;justify-content:center;border-radius:16px;border:1px solid var(--line);
  background-color:#fbfdff;
  background-image:linear-gradient(45deg,#eef3f9 25%,transparent 25%,transparent 75%,#eef3f9 75%),
                   linear-gradient(45deg,#eef3f9 25%,transparent 25%,transparent 75%,#eef3f9 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;overflow:hidden}
#cv{image-rendering:pixelated;display:block}
#pmdCtl{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
#pmdCtl button{flex:1;min-width:64px;padding:12px 6px;border-radius:12px;background:#fff;
  border:1px solid var(--line);color:var(--fg);font-size:13px;font-family:inherit}
#pmdCtl button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* 底部导航 */
#selbar{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 10px);background:#ffffff;box-shadow:var(--shadow);
  border-top:1px solid var(--line);display:none;gap:6px;padding:8px 10px;z-index:30}
#selbar.on{display:flex}
#selbar button{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
  background:var(--panel2);color:var(--fg);font-size:12.5px;font-family:inherit}
#selbar button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#selbar button:disabled{opacity:.4}

/* 进度浮层 */
#prog{box-shadow:var(--shadow);position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--safe-b) + 8px);
  background:#141b23;border:1px solid var(--line);border-radius:14px;padding:12px 14px;z-index:40;
  display:none;box-shadow:0 8px 30px #0008}
#prog.on{display:block}
#prog .t{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
#prog .bar{height:6px;border-radius:3px;background:#243040;overflow:hidden}
#prog .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}

/* 大图 */
#zoom{position:fixed;inset:0;background:#000;z-index:60;display:none;
  flex-direction:column;padding-top:calc(var(--safe-t) + 8px)}
#zoom.on{display:flex}
#zoomTop{display:flex;justify-content:space-between;padding:0 12px 8px;align-items:center;gap:8px}
#zoomTop .name{font-size:13px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zoomBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  touch-action:none}
#zoomBody img{max-width:100%;max-height:100%;image-rendering:pixelated;transform-origin:center}
#zoomBot{display:flex;gap:6px;padding:10px 12px calc(var(--safe-b) + 10px)}
#zoomBot button{flex:1;padding:12px 4px;border-radius:10px;border:1px solid var(--line);
  background:#1a222b;color:var(--fg);font-size:12.5px;font-family:inherit}

/* toast */
/* 宽屏（桌面浏览器）：网格铺开，手机端完全不受影响 */
@media (min-width:900px){
  #app{max-width:1440px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr)) !important}
  .card .box{height:124px;aspect-ratio:auto}
  .chips{flex-wrap:wrap;overflow:visible}
  #views{padding-bottom:16px}
  nav{height:56px}
  #selbar{max-width:1440px;left:50%;transform:translateX(-50%);width:100%;
    bottom:calc(56px + var(--safe-b))}
  #prog{box-shadow:var(--shadow);max-width:900px;margin:0 auto;bottom:calc(56px + var(--safe-b) + 10px)}
}
@media (min-width:1280px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important}
  .card .box{height:140px}
}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);
  background:var(--panel);scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pcell{flex:none;width:62px;text-align:center;cursor:pointer}
.pcell img{width:56px;height:56px;image-rendering:pixelated;background:#f7fafd;border-radius:10px;
  border:1px solid var(--line)}
.pcell span{display:block;font-size:9.5px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pmdLabel{font-size:11.5px;color:var(--dim);padding:6px 12px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--fab) + var(--safe-b) + 16px);transform:translateX(-50%);
  background:#000c;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:80;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}
.muted{color:var(--dim);font-size:12.5px;padding:0 12px 10px}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:13.5px}
.sect{color:var(--dim);font-size:12px;padding:14px 12px 4px}

/* ---------- 分类栏 / 展开面板 / 迷宫分栏 / 精灵球 ---------- */
.chipbar{flex:none;display:flex;align-items:center;background:var(--bg);
  position:sticky;top:0;z-index:6;border-bottom:1px solid var(--line)}
.chipbar .chips{flex:1;min-width:0;padding:0 8px}
.chipbar .chipExpand{flex:none;width:28px;height:28px;margin-left:8px;border-radius:10px;
  background:#fff;border:1px solid var(--line);color:var(--acc);box-shadow:var(--shadow);font-size:13px;
  font-family:inherit;display:flex;align-items:center;justify-content:center}
#chipFull{position:absolute;left:0;right:0;top:0;bottom:0;z-index:40;background:#f4f7fbf2;
  display:none;flex-direction:column}
#chipFull.on{display:flex}
#chipFull .fh{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg)}
#chipFull .fb{flex:1;overflow:auto;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
#chipFull .fb .chip{font-size:13px;padding:8px 14px}
#pmdLayout{flex:1;display:flex;min-height:0}
#pmdLayout.lefty{flex-direction:row-reverse}
#pmdMain{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.sidecol{flex:none;width:34%;max-width:180px;min-width:100px;overflow-y:auto;
  border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px}
#pmdLayout.lefty .sidecol{border-left:0;border-right:1px solid var(--line)}
.sidecol .chip{flex:none;font-size:11.5px;padding:7px 6px;text-align:center;border-radius:9px}
#fab{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;border:0;padding:0;z-index:62;background:#fff;
  box-shadow:0 6px 18px rgba(110,150,200,.28);display:flex;align-items:center;justify-content:center}
#fab .ball{width:36px;height:36px;border-radius:50%;position:relative;overflow:hidden;
  background:linear-gradient(#ee3d3d 0 47%,#1b1b1b 47% 53%,#f4f7fb 53% 100%);border:2px solid #111}
#fab .ball::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;
  margin:-8px 0 0 -8px;border-radius:50%;background:#f4f7fb;border:2px solid #111}
#fab.on .ball{transform:rotate(90deg);transition:transform .25s}
#fab{transition:transform .28s cubic-bezier(.2,.9,.25,1.1)}
#fab.hide{transform:translate(-50%,34px)}
#fab.hide .ball{transform:scale(.92)}
#radial{position:fixed;inset:0;z-index:61;pointer-events:none}
#radial.on{pointer-events:auto}
#radial .rt{position:absolute;left:50%;bottom:calc(var(--safe-b) + 16px);width:52px;height:52px;
  border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  font-size:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;opacity:0;
  transition:transform .24s cubic-bezier(.2,.9,.25,1.1),opacity .16s;
  transform:translate(-50%,0) scale(.4)}
#radial.on .rt{opacity:1}
#radial .rt .ic{font-size:16px;line-height:1}
#radial .rt.on{color:var(--acc2);border-color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="btnSrc" title="图片源">主</button>
    <input id="q" autocomplete="off" spellcheck="false">
    <button class="iconbtn" id="btnSet" title="设置">⚙</button>
    <button class="iconbtn" id="btnBack" title="返回" style="display:none">←</button>
  </header>

  <div id="views">
    <section class="view on" id="v-showdown">
      <div class="chipbar"><button class="chipExpand" id="sdExpand">▾</button>
        <div class="chips" id="sdChips"></div></div>
      <div class="grid" id="sdGrid"></div>
    </section>

    <section class="view" id="v-pmd">
      <div id="pmdLayout">
        <div id="pmdMain">
          <div id="pmdTop">
            <select id="pmdForm"></select>
            <select id="pmdAct"></select>
            <select id="pmdDir"></select>
          </div>
          <div id="pmdCanvasWrap"><canvas id="cv" width="120" height="120"></canvas></div>
          <div id="pmdCtl">
            <button id="pmdPlay" class="on">暂停</button>
            <button id="pmdShadow">影子</button>
            <button id="pmdEight">8向</button>
            <button id="pmdGif">保存GIF</button>
            <button id="pmdSave">保存</button>
          </div>
          <div id="pmdLabel">表情头像 · 点开可保存，长按可多选</div>
          <div class="pstrip" id="pmdPortraits"></div>
        </div>
        <div class="sidecol" id="pmdChips"></div>
      </div>
    </section>

    <section class="view" id="v-cafe">
      <div class="chipbar"><button class="chipExpand" id="cfExpand">▾</button>
        <div class="chips" id="cfChips"></div></div>
      <div class="grid" id="cfGrid"></div>
    </section>

    <section class="view" id="v-off">
      <div class="chipbar"><button class="chipExpand" id="offExpand">▾</button>
        <div class="chips" id="offChips"></div></div>
      <div class="grid" id="offGrid"></div>
    </section>

    <section class="view" id="v-fav">
      <div class="chipbar"><button class="chipExpand" id="favExpand" style="visibility:hidden">▾</button>
        <div class="chips" id="favChips"></div></div>
      <div class="grid" id="favGrid"></div>
    </section>

    <section class="view" id="v-set">
      <div class="rows" id="setRows"></div>
      <div class="muted" id="about"></div>
    </section>

    <div id="chipFull"><div class="fh"><span id="cfTitle">全部分类</span>
      <button class="iconbtn" id="cfClose">✕</button></div>
      <div class="fb" id="cfBody"></div></div>
  </div>

  <div id="selbar">
    <button id="selAll">全选</button>
    <button id="selFav">收藏</button>
    <button id="selSave" class="primary">保存</button>
    <button id="selExit">取消</button>
  </div>

  <div id="prog"><div class="t"><span id="progT">准备中…</span><span id="progN"></span></div>
    <div class="bar"><i id="progBar"></i></div></div>

  <button id="fab" title="菜单"><span class="ball"></span></button>
  <div id="radial"></div>
</div>

<div id="zoom">
  <div id="zoomTop"><div class="name" id="zoomName"></div>
    <button class="iconbtn" id="zoomClose">✕</button></div>
  <div id="zoomBody"><img id="zoomImg" alt=""></div>
  <div id="zoomBot">
    <button id="zoomFav">收藏</button>
    <button id="zoomSave">保存</button>
    <button id="zoomShuffle">来一张</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   PokePic —— 宝可梦贴图浏览
   数据：data/*.json       图片：Showdown / PMD / PokeAPI CDN + 内置 Cafe
   ===================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* 镜像：raw.githubusercontent.com 在部分网络下会「挂起」，jsDelivr 又只是 301 回 raw，
   所以用「对原始 URL 做前缀包装」的代理。按顺序尝试，成功哪个记住哪个（localStorage）。
   每个请求必须带超时 —— 挂起不会报错，只会一直等。 */
const RAW_PK  = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/';
const RAW_PMD = 'https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/';

const _jsd = raw => raw.replace('https://raw.githubusercontent.com/', 'https://fastly.jsdelivr.net/gh/')
                         .replace(/\/master\//, '@master/');
const MIRRORS = {
  raw:      raw => raw,
  jsd:      _jsd,
  ghproxy:  raw => 'https://ghproxy.net/' + raw,
  ghproxy2: raw => 'https://gh-proxy.com/' + raw,
};
/* 三个可选项：主 = 直连；备 = jsDelivr；Auto = 代理优先的完整链条 */
const MODES = [
  { id:'main',   label:'主',   chain:['raw'] },
  { id:'backup', label:'备',   chain:['jsd'] },
  { id:'auto',   label:'Auto', chain:['ghproxy','ghproxy2','raw'] },
];
const mode = () => MODES[S.mode] || MODES[2];
const MIRROR_LAST = () => MODES[S.mode].chain[Math.min(S.chainAt, MODES[S.mode].chain.length - 1)];
const M = () => ({ u: MIRRORS[MIRROR_LAST()] });
const mirrorOrder = () => mode().chain.slice(S.chainAt).concat(mode().chain.slice(0, S.chainAt));

/** 带超时的 fetch：挂起的源不设超时就会一直等。 */
function fetchT(url, ms){
  const ac = new AbortController();
  const timer = setTimeout(() => { try { ac.abort(); } catch(e){} }, ms || 7000);
  return fetch(url, {signal: ac.signal}).finally(() => clearTimeout(timer));
}

/** 拿一个「原始 raw URL」，按镜像顺序挨个试，返回第一个成功的响应。 */
async function fetchRaw(rawUrl, ms){
  let lastErr = '未知错误';
  for (const name of mirrorOrder()){
    const url = MIRRORS[name](rawUrl);
    try{
      const r = await fetchT(url, ms);
      if(!r.ok){ lastErr = 'HTTP ' + r.status; continue; }
      const at = mode().chain.indexOf(name);
      if(at > 0){ S.chainAt = at; localStorage.setItem('mirrorAt', name); }
      return {res:r, url};
    }catch(e){
      lastErr = (e && e.name === 'AbortError') ? '超时' : (e && e.message) || String(e);
    }
  }
  throw new Error(lastErr);
}

/** 给 <img> 挂镜像兜底：当前源失败就换下一个，全失败才显示「无图」。 */
function imgFrom(img, rawUrl){
  const order = mirrorOrder();
  let tried = 0;
  img.onerror = () => {
    tried++;
    if(tried >= order.length){
      img.onerror = null;
      const p = img.parentElement; if(p) p.innerHTML = '<span style="color:#4a5563;font-size:10px">无图</span>';
      return;
    }
    img.src = MIRRORS[order[tried]].u(rawUrl);
  };
  img.src = MIRRORS[order[0]](rawUrl);
}

const SD_BASE = 'https://play.pokemonshowdown.com/sprites/';
// Café 图片不在安装包里了，统一从云端取；如果在部署站上打开就走同源相对路径（更快、可复用浏览器缓存）
const CAFE_REMOTE = 'https://sgorgeous.github.io/pokemon-sprite/PokemonCafeRemix/';
const CAFE_BASE = (location.hostname === 'sgorgeous.github.io')
  ? 'PokemonCafeRemix/'
  : CAFE_REMOTE;

const S = {
  mode:2, chainAt:0, favFolder:'default',
  subs:[], groups:[], nameMap:null, subIds:[], subCache:{},
  pmd:[], official:[], zh:{}, offKind:'official-artwork', offShiny:false,
  cafe:[], cafeGroup:'',
  view:'showdown', sub:'ani', query:'',
  sel:new Set(), selMode:false,
  build:null,
  shown:120,
};

/* ---------------- 工具 ---------------- */
const enc = p => String(p).split('/').map(encodeURIComponent).join('/');

/* 中文名 → 英文 id。用户输入「皮卡丘」时先翻成 pikachu 再匹配；
   支持「皮卡丘ex」这种中文前缀 + 英文后缀的混输。 */
const hasCJK = s => /[\u3400-\u9fff\uf900-\ufaff]/.test(s);
function zhToEn(q){
  const raw = String(q || '').trim();
  if (!raw || !hasCJK(raw)) return raw;
  for (let n = raw.length; n >= 1; n--) {
    const head = raw.slice(0, n);
    const hit = S.zh[head];
    if (hit) return hit + raw.slice(n);
  }
  return raw;
}

/* ---------------- IndexedDB ---------------- */
const DB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open('pokepic', 2);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('cache')) d.createObjectStore('cache',{keyPath:'url'});
        if(!d.objectStoreNames.contains('fav')) d.createObjectStore('fav',{keyPath:'key'});
        if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
      };
      r.onsuccess = e => { DB.db = e.target.result; res(DB.db); };
      r.onerror = e => rej(e);
    });
  },
  tx(store, mode){ return DB.db.transaction(store, mode||'readonly').objectStore(store); },
  put(store, obj){ return new Promise((res,rej)=>{ const r=DB.tx(store,'readwrite').put(obj);
    r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); }); },
  get(store, key){ return new Promise((res)=>{ const r=DB.tx(store).get(key);
    r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); },
  del(store, key){ return new Promise((res)=>{ const r=DB.tx(store,'readwrite').delete(key);
    r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); },
  all(store){ return new Promise((res)=>{ const r=DB.tx(store).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); },
  clear(store){ return new Promise((res)=>{ const r=DB.tx(store,'readwrite').clear();
    r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); },
};

/* ---------------- 数据加载 ---------------- */
async function loadData(){
  // 注意 BOM：PowerShell 的 Set-Content -Encoding utf8 会写 BOM，
  // 浏览器里 JSON.parse 遇到它会直接抛错，所以统一先剥掉再解析。
  const j = async u => {
    const r = await fetch(u);
    if(!r.ok) throw new Error(u + ' → ' + r.status);
    const t = (await r.text()).replace(/^\uFEFF/, '');
    return JSON.parse(t);
  };
  const [subs, names, pmd, official, cafe, zh] = await Promise.all([
    j('data/subs.json'), j('data/names.json'), j('data/pmd.json'),
    j('data/official.json'), j('data/cafe.json').catch(()=>[]),
    j('data/zh.json').catch(()=>({})),
  ]);
  S.zh = zh || {};
  S.subs = subs.subs; S.groups = subs.groups;
  S.nameMap = names.map; S.subIds = names.subs;
  S.pmd = pmd; S.official = official;
  // 兼容两种 cafe.json：完整字段（打包版）与短字段（网页版旧数据）
  S.cafe = (cafe||[]).map(x=>({
    g: x.g != null ? x.g : x.group,
    s: x.s != null ? x.s : (x.species||''),
    o: x.o != null ? x.o : (x.outfit||''),
    c: x.c != null ? x.c : (x.customer ? 1 : 0),
    f: x.f != null ? x.f : x.file,
    w: x.w, h: x.h
  }));
  S.build = await j('data/build.json').catch(()=>({appVersion:'1.0', cafeVersion:'', cafeCount:S.cafe.length}));
}

/* 缓存优先：有 blob 就用 blob，否则用原始地址 */
async function srcFor(url){
  try{
    const row = await DB.get('cache', url);
    if(row && row.blob) return URL.createObjectURL(row.blob);
  }catch(e){}

function cardEl(opts){
  // opts: {key, url, title, sub, onOpen}
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.key = opts.key;
  d.dataset.title = opts.title || '';
  d.dataset.sub = opts.sub || '';
  d.innerHTML = `<div class="box"></div><div class="cap"><b>${esc(opts.title)}</b>${
      opts.sub ? '<br>'+esc(opts.sub) : ''}</div><div class="tick">✓</div>`;
  const img = document.createElement('img');
  img.loading = 'lazy'; img.decoding = 'async';
  img.onload = () => img.classList.add('ok');
  img.onerror = () => { const b=img.parentElement; if(b) b.innerHTML = '<span style="color:#4a5563;font-size:10px">无图</span>'; };
  img.src = opts.url;
  if(opts.cacheFirst){
    // 有 IndexedDB 缓存就直接换成本地 blob，离线和二次打开都快
    srcFor(opts.url).then(u => { if(u && u !== opts.url) img.src = u; }).catch(()=>{});
  }
  d.querySelector('.box').appendChild(img);
  return d;
}

function bindGrid(grid, items, onOpen){
  // 长按进入多选。踩过的坑：原来 pointermove 里无脑取消计时器，
  // 手指一抖（安卓上 pointerdown 后几乎必来一次 1px 的 move）就永远触发不了。
  // 现在改成「位移超过 12px 才取消」，并且长按后吃掉紧跟的那次 click。
  let timer = null, sx = 0, sy = 0, suppress = false;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };

  grid.addEventListener('pointerdown', e => {
    const c = e.target.closest('.card'); if (!c) return;
    sx = e.clientX; sy = e.clientY; suppress = false;
    clear();
    timer = setTimeout(() => {
      timer = null; suppress = true;
      enterSel(c.dataset.key);
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (err) {} }
    }, 450);
  }, {passive:true});

  grid.addEventListener('pointermove', e => {
    if (!timer) return;
    if (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) clear();
  }, {passive:true});

  grid.addEventListener('pointerup', clear, {passive:true});
  grid.addEventListener('pointercancel', clear, {passive:true});
  grid.addEventListener('pointerleave', clear, {passive:true});

  grid.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c) return;
    if (suppress) { suppress = false; return; }     // 长按后松开，别再当成点选
    const key = c.dataset.key;
    if (S.selMode) { toggleSel(key); return; }
    onOpen && onOpen(key, c);
  });
}

function toggleSel(key){
  if(S.sel.has(key)) S.sel.delete(key); else S.sel.add(key);
  syncSel();
}
function enterSel(key){
  if(!S.selMode){ S.selMode = true; $('#selbar').classList.add('on'); }
  S.sel.add(key); syncSel(); toast('已进入多选', 900);
}
function exitSel(){
  S.selMode = false; S.sel.clear(); $('#selbar').classList.remove('on');
  $$('.card.sel').forEach(c=>c.classList.remove('sel'));
  $$('.card .tick').forEach(t=>t.classList.remove('on'));
}
function syncSel(){
  $$('.card').forEach(c=>{
    const on = S.sel.has(c.dataset.key);
    c.classList.toggle('sel', on);
    const t = c.querySelector('.tick'); if(t) t.classList.toggle('on', on);
  });

  $('#selbar').querySelectorAll('button').forEach(b=>{});
}

function pimg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i);
  i.onerror=()=>rej(new Error(src)); i.src=src; }); }

/** 动作图按镜像顺序试，成功就记住那个源。 */
async function pmdImg(dex, path, action, kind){
  const raw = pmdRawURL(dex, path, action, kind);
  let lastErr = null;
  for(const name of mirrorOrder()){
    try{
      const im = await pimg(MIRRORS[name](raw));
      const at = mode().chain.indexOf(name);
      if(at > 0){ S.chainAt = at; localStorage.setItem('mirrorAt', name); }
      return im;
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no mirror');
}
async function loadPmdAction(){
  const f = P.cur.forms[+$('#pmdForm').value];
  const a = P.actions[+$('#pmdAct').value];
  if(!f||!a) return;
  const token = ++P.reqId;
  P.action = a; P.frame = 0; P.acc = 0;
  try{
    const jobs = [pmdImg(P.cur.dex, f.p, a.name, 'Anim')];
    jobs.push(P.useShadow ? pmdImg(P.cur.dex, f.p, a.name, 'Shadow').catch(()=>null) : null);
    const [anim, sh] = await Promise.all(jobs);
    if(token!==P.reqId) return;
    P.anim = anim; P.shadowImg = sh;
    drawPmd();
  }catch(e){ P.anim=null; toast('缺少 '+a.name+'-Anim.png'); }
}
function drawPmd(){
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const a = P.action;
  if(!a||!P.anim){ cv.width=1; cv.height=1; return; }
  const maxW = $('#pmdCanvasWrap').clientWidth - 24;
  const maxH = $('#pmdCanvasWrap').clientHeight - 24;
  const z = Math.max(1, Math.min(P.zoom, Math.floor(maxW/a.fw), Math.floor(maxH/a.fh)));
  const w = a.fw*z, h = a.fh*z;
  cv.width=w; cv.height=h;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,w,h);
  if(P.useShadow && P.shadowImg){ ctx.globalAlpha=.4;
    ctx.drawImage(P.shadowImg, P.frame*a.fw, P.dir*a.fh, a.fw, a.fh, 0,0,w,h); ctx.globalAlpha=1; }
  ctx.drawImage(P.anim, P.frame*a.fw, P.dir*a.fh, a.fw, a.fh, 0,0,w,h);
}
function pmdLoop(t){
  requestAnimationFrame(pmdLoop);
  const a = P.action;
  if(!a||!P.anim||!P.playing||S.view!=='pmd') return;
  const dt = P.last ? (t-P.last)/1000 : 0; P.last = t;
  let ch = false; P.acc += dt*60; let g=0;
  while(P.acc >= (a.durations[P.frame]??1) && g++<60){
    P.acc -= (a.durations[P.frame]??1);
    P.frame = (P.frame+1) % a.durations.length; ch = true;
  }
  if(ch) drawPmd();
}

/* ---- 形态译名 ----
   官方叫法：
     -mega / -megax / -megay  → 超级XX / 超级XX X / 超级XX Y
     -gmax                    → 超极巨XX
     -alola/-galar/-hisui/…   → XX（阿罗拉的样子）
     -f/-m                    → XX♀ / XX♂
   拼不出来的后缀（又没有宝可梦名可译）就只译宝可梦名，其余原样保留。
*/
const PREFIX_FORM = {
  mega:'超级', megax:'超级', megay:'超级',
  primal:'原始', gmax:'超极巨',
};
const REGION_FORM = {

  alolatotem:'阿罗拉', galartotem:'伽勒尔',
};

const MARK_FORM = {
  totem:'霸主', origin:'起源', therian:'灵兽', sky:'天空', land:'化身',
  white:'白', black:'黑', resolute:'觉悟', pirouette:'舞步', blade:'刀剑', shield:'盾牌',
  zen:'达摩', complete:'完全', unbound:'解放', eternal:'永恒', ash:'小智版',
};

function zhBase(key){
  if(!S.zhById) return null;
  if(S.zhById.has(key)) return S.zhById.get(key);
  const parts = key.split('-');
  while(parts.length > 1){
    parts.pop();
    const b = parts.join('-');
    if(S.zhById.has(b)) return S.zhById.get(b);
  }
  return null;
}

function dispName(idOrName){
  const raw = String(idOrName || '');
  if(!raw) return '';
  const lang = localStorage.getItem('lang') || 'zh';
  if(lang === 'en') return titleCase(raw);

  const key = raw.toLowerCase().replace(/\s+/g, '-');
  let zh = zhBase(key);
  // 「Alolan Exeggutor」这类以地区开头的英文名
  if(!zh){
    const REGION_EN = { alolan:'阿罗拉', galarian:'伽勒尔', hisuian:'洗翠',
                        paldean:'帕底亚', alola:'阿罗拉', galar:'伽勒尔' };
    const words = raw.split(/\s+/);
    if(words.length > 1){
      const rg = REGION_EN[words[0].toLowerCase()];
      if(rg){
        const rest = zhBase(words.slice(1).join('-').toLowerCase());
        if(rest) zh = rest;
        if(rest) return `${rest}（${rg}的样子）`;
      }
    }
  }
  if(!zh) return titleCase(raw);        // 完全没有中文名 → 原样

  const parts = key.split('-');
  const base = key.split('-')[0];       // showdown id 的第一段就是宝可梦
  const suffix = parts.slice(1);

  let prefix = '', region = '', sex = '', extra = [], marks = '';
  for(const t of suffix){
    if(PREFIX_FORM[t] && !prefix){
      prefix = PREFIX_FORM[t];
      if(t === 'megax') marks += 'X';
      if(t === 'megay') marks += 'Y';
    } else if(REGION_FORM[t] && !region){
      region = REGION_FORM[t];
    } else if(SEX_FORM[t]){
      sex = SEX_FORM[t];
    } else if(MARK_FORM[t]){
      extra.push(MARK_FORM[t] + '形态');
    }
    // 认不出的后缀忽略 —— 只保留宝可梦名
  }
  let out = (prefix || '') + zh + sex + marks;
  if(!region && !extra.length) return out;
  return out + '（' + [region ? region + '的样子' : '', extra.join('·')].filter(Boolean).join('·') + '）';
}

/* 原生保存桥（APK 外壳注入；浏览器里没有就走下载）
   走的是 shouldInterceptRequest 拦截的 https://app.local/__save，不用 evaluateJavascript。
   —— 旧实现在部分 WebView 上拿不到回调，表现为「点了保存卡住」，所以改掉了。 */
const BRIDGE = 'https://app.local/';
let nativeOK = false;
let lastSaveErr = '';

async function probeBridge(){
  try{
    const r = await Promise.race([
      fetch(BRIDGE + '__ping', {cache:'no-store'}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500)),
    ]);
    const j = await r.json();
    nativeOK = !!(j && j.native);
  }catch(e){ nativeOK = false; }
  return nativeOK;
}

async function checkPerm(){
  if(!nativeOK) return {native:false};
  try{
    const r = await fetch(BRIDGE + '__perm', {cache:'no-store'});
    return await r.json();
  }catch(e){ return {native:true, err:String(e)}; }
}

async function nativeSave(url, name){
  if(!nativeOK) return {ok:false, err:'no-bridge'};
  let id = null;
  try{
    const r = await fetch(BRIDGE + '__save?name=' + encodeURIComponent(name) +
                          '&url=' + encodeURIComponent(url), {cache:'no-store'});
    const j = await r.json();
    if(!j || !j.id) return {ok:false, err:(j && j.msg) || '派发失败'};
    id = j.id;
  }catch(e){ return {ok:false, err:'桥不可用: ' + e.message}; }

  for(let i=0;i<180;i++){                 // 最多等 72 秒
    await new Promise(r=>setTimeout(r,400));
    try{
      const st = await (await fetch(BRIDGE + '__status?id=' + id, {cache:'no-store'})).json();
      if(st.state === 'ok') return {ok:true, path:st.msg};
      if(st.state === 'err') return {ok:false, err:st.msg || '写入失败'};
    }catch(e){}
  }
  return {ok:false, err:'超时'};
}

async function saveOne(item){
  const r = await nativeSave(item.url, item.name);
  if(r.ok) return true;
  if(r.err === 'no-bridge'){
    const a = document.createElement('a');
    a.href = item.url; a.download = item.name; document.body.appendChild(a); a.click(); a.remove();
    return true;
  }
  if(!lastSaveErr) lastSaveErr = r.err;
  return false;
}

async function doSave(items){
  if(!items.length) return;
  lastSaveErr = '';
  progShow('保存到相册');
  let ok=0;
  for(let i=0;i<items.length;i++){
    const r = await saveOne(items[i]);
    if(r) ok++;
    progSet(i+1, items.length, `保存到相册（${ok} 成功）`);
  }
  progHide();
  if(ok === items.length) toast(`已保存 ${ok} 张`);
  else if(ok === 0) toast('保存失败：' + (lastSaveErr || '未知原因'), 4200);
  else toast(`已保存 ${ok}/${items.length}，失败原因：${lastSaveErr}`, 4200);
}

async function doCache(items){
  if(!items.length) return;
  progShow('缓存到本地');
  let ok=0, bytes=0;
  for(let i=0;i<items.length;i++){
    const it = items[i];
    try{
      const exists = await DB.get('cache', it.url);
      if(!exists){
        const r = await fetch(it.url);
        if(!r.ok) throw new Error(r.status);
        const b = await r.blob();
        bytes += b.size;
        await DB.put('cache', {url:it.url, blob:b, ts:Date.now(), size:b.size});
      }
      ok++;
    }catch(e){}
    progSet(i+1, items.length, `缓存到本地（${ok} 张 / ${fmtSize(bytes)}）`);
  }
  progHide();
  toast(`已缓存 ${ok}/${items.length} 张`);
}

/* ---------------- 保存 GIF ---------------- */
/* 极简 GIF89a 编码：固定 256 色调色板 + 透明色 0 + LZW。够用在像素图上。 */
function lzwEncode(bytes, minCodeSize){
  const clear = 1 << minCodeSize, eoi = clear + 1;
  let next = eoi + 1, size = minCodeSize + 1, table = new Map();
  const out = []; let acc = 0, accBits = 0;
  const emit = c => { acc |= c << accBits; accBits += size;
    while(accBits >= 8){ out.push(acc & 255); acc >>= 8; accBits -= 8; } };
  emit(clear);
  let ib = bytes[0];
  for(let i = 1; i < bytes.length; i++){
    const k = bytes[i], key = (ib << 8) | k;
    const hit = table.get(key);
    if(hit !== undefined){ ib = hit; continue; }
    emit(ib);
    if(next === 4096){ emit(clear); table = new Map(); next = eoi + 1; size = minCodeSize + 1; }
    else { if(next >= (1 << size) && size < 12) size++; table.set(key, next++); }
    ib = k;
  }
  emit(ib); emit(eoi);
  if(accBits > 0) out.push(acc & 255);
  return out;
}

function gifEncode(frames, delayCs, w, h){
  // 调色板：统计所有帧的颜色，取前 255 个；索引 0 留给透明
  const hist = new Map();
  for(const f of frames) for(let i = 0; i < f.length; i += 4){
    if(f[i + 3] < 128) continue;
    const k = (f[i] << 16) | (f[i + 1] << 8) | f[i + 2];
    hist.set(k, (hist.get(k) || 0) + 1);
  }
  const top = [...hist.entries()].sort((a, b) => b[1] - a[1]).slice(0, 255).map(e => e[0]);
  const pal = [[0, 0, 0]].concat(top.map(c => [(c >> 16) & 255, (c >> 8) & 255, c & 255]));
  const cache = new Map();
  const idx = (r, g, b) => {
    const k = (r << 16) | (g << 8) | b;
    let v = cache.get(k); if(v !== undefined) return v;
    let best = 1, bd = 1e9;
    for(let i = 1; i < pal.length; i++){
      const dr = r - pal[i][0], dg = g - pal[i][1], db = b - pal[i][2];
      const d = dr * dr + dg * dg + db * db;
      if(d < bd){ bd = d; best = i; if(d === 0) break; }
    }
    cache.set(k, best); return best;
  };

  const out = [];
  const w2 = v => { out.push(v & 255, (v >> 8) & 255); };
  out.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61);      // GIF89a
  w2(w); w2(h);
  out.push(0xF7, 0, 0);                               // 256 色全局调色板
  for(let i = 0; i < 256; i++){ const c = pal[i] || [0, 0, 0]; out.push(c[0], c[1], c[2]); }
  out.push(0x21, 0xFF, 0x0B);
  out.push(0x4E, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2E, 0x30);
  out.push(0x03, 0x01, 0x00, 0x00, 0x00);             // 循环播放

  for(const f of frames){
    const pixels = new Uint8Array(w * h);
    for(let i = 0, p = 0; i < f.length; i += 4, p++)
      pixels[p] = f[i + 3] < 128 ? 0 : idx(f[i], f[i + 1], f[i + 2]);
    out.push(0x21, 0xF9, 0x04, 0x09); w2(delayCs); out.push(0x00, 0x00);
    out.push(0x2C); w2(0); w2(0); w2(w); w2(h); out.push(0x00);
    out.push(8);
    const data = lzwEncode(pixels, 8);
    for(let i = 0; i < data.length; i += 255){
      const chunk = data.slice(i, i + 255);
      out.push(chunk.length, ...chunk);
    }
    out.push(0);
  }
  out.push(0x3B);
  return new Blob([new Uint8Array(out)], {type: 'image/gif'});
}

/* 优先走原生桥（App 里才有），否则浏览器下载 */
async function saveBlob(blob, name){
  if(nativeOK && blob.size <= 380 * 1024){
    try{
      const b64 = await new Promise((ok, bad) => {
        const fr = new FileReader();
        fr.onload = () => ok(String(fr.result).split(',')[1]);
        fr.onerror = bad; fr.readAsDataURL(blob);
      });
      const r = await fetch(BRIDGE + '__saveb64?name=' + encodeURIComponent(name) +
                            '&b64=' + encodeURIComponent(b64), {cache:'no-store'});
      const st = await r.json();
      if(st.state === 'ok') return true;
      toast('原生保存失败，改走下载：' + (st.msg || ''), 3200);
    }catch(e){ toast('原生保存异常，改走下载', 2600); }
  }
  blobDownload(blob, name);
  return true;
}

function blobDownload(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

async function saveGif(){
  const f = P.cur.forms[+$('#pmdForm').value];
  const a = P.action;
  if(!f || !a || !P.anim) { toast('先选中一个动作'); return; }
  progShow('生成 GIF');
  try{
    // 画布跨域会被污染（getImageData 直接抛错），所以先取 blob 再用同源 objectURL 画
    const grab = async (kind) => {
      const {res} = await fetchRaw(pmdRawURL(P.cur.dex, f.p, a.name, kind), 15000);
      const url = URL.createObjectURL(await res.blob());
      const img = await new Promise((ok, bad) => {
        const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url;
      });
      return img;
    };
    const anim2 = await grab('Anim');
    const shadow2 = (P.useShadow ? await grab('Shadow').catch(() => null) : null);

    const dir = P.eight ? 8 : 1;
    const dirs = P.eight ? [...Array(8).keys()] : [P.dir];
    let n = 0;
    for(const d of dirs){
      const frames = [];
      const cv = document.createElement('canvas');
      cv.width = a.fw; cv.height = a.fh;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      for(let i = 0; i < a.durations.length; i++){
        ctx.clearRect(0, 0, a.fw, a.fh);
        if(shadow2){
          ctx.globalAlpha = .4;
          ctx.drawImage(shadow2, i * a.fw, d * a.fh, a.fw, a.fh, 0, 0, a.fw, a.fh);
          ctx.globalAlpha = 1;
        }
        ctx.drawImage(anim2, i * a.fw, d * a.fh, a.fw, a.fh, 0, 0, a.fw, a.fh);
        frames.push(ctx.getImageData(0, 0, a.fw, a.fh).data);
        progSet(++n, dirs.length * a.durations.length, `生成 GIF（${n}）`);
      }
      const blob = gifEncode(frames, 4, a.fw, a.fh);
      const nm = `${P.cur.name.replace(/_$/,'')}_${f.n || 'base'}_${a.name}${P.eight ? '_d' + d : ''}.gif`;
      await saveBlob(blob, nm);
    }
    progHide();
    toast(`已导出 ${dirs.length} 个 GIF（${P.eight ? '8 方向' : '单方向'}）`);
  }catch(e){
    progHide();
    toast('GIF 失败：' + (e && e.message || e), 4000);
  }
}

function shiftZoom(d){

/* 从 GitHub 检查更新：Café 增量 + 数据刷新 */
async function checkUpdate(){
  progShow('检查更新');
  try{
    const base = 'https://sgorgeous.github.io/pokemon-sprite/';
    const r = await fetch(base + 'update.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('update.json ' + r.status);
    const up = await r.json();
    const cur = S.build || {};
    if(up.cafeVersion && up.cafeVersion !== cur.cafeVersion){
      // 拉新的 index，把不认识的图补进缓存
      const idx = await (await fetch(base + 'PokemonCafeRemix/index.json?t=' + Date.now(), {cache:'no-store'})).json();
      const known = new Set(S.cafe.map(x=>x.f));
      const fresh = idx.map(x=>({g:x.group,s:x.species||'',o:x.outfit||'',c:x.customer?1:0,f:x.file,w:x.w,h:x.h}))
                       .filter(x=>!known.has(x.f));
      if(fresh.length){
        progSet(0, fresh.length, `新增 ${fresh.length} 张，下载中`);
        let ok=0;
        for(let i=0;i<fresh.length;i++){
          try{
            const u = base + CAFE_BASE + enc(fresh[i].f);
            const resp = await fetch(u);
            if(resp.ok){
              const b = await resp.blob();
              await DB.put('cache', {url:cafeURL(fresh[i].f), blob:b, ts:Date.now(), size:b.size});
              ok++;
            }
          }catch(e){}
          progSet(i+1, fresh.length, `下载新素材（${ok}/${fresh.length}）`);
        }
        S.cafe = S.cafe.concat(fresh);
        localStorage.setItem('cafeExtra', JSON.stringify(fresh));
        try{ await DB.put('meta', {k:'cafeVersion', v:up.cafeVersion}); }catch(e){}
        renderCf(); renderSet();
        progHide();
        toast(`已更新 ${fresh.length} 张新素材`);
        return;
      }
      S.cafe = idx.map(x=>({g:x.group,s:x.species||'',o:x.outfit||'',c:x.customer?1:0,f:x.file,w:x.w,h:x.h}));
      localStorage.setItem('cafeExtra', '[]');
      progHide(); toast('素材索引已刷新'); renderCf(); return;
    }
    progHide();
    const hasNew = up.apkVersion && isNewer(up.apkVersion, cur.appVersion);
    if(hasNew && up.apkUrl){
      localStorage.setItem('apkNew', JSON.stringify({v:up.apkVersion, u:up.apkUrl}));
      toast('发现新版本 ' + up.apkVersion + '，去设置里下载', 3200);
    } else {
      localStorage.removeItem('apkNew');
      toast('已是最新');
    }
  }catch(e){
    progHide();
    toast('检查失败：' + e.message);
  }
}

/* ---------------- 视图切换 ---------------- */
const VIEWS = [
  { id:'showdown', label:'图鉴', ic:'◈' },
  { id:'pmd',      label:'迷宫', ic:'✧' },
  { id:'cafe',     label:'咖啡', ic:'☕' },
  { id:'off',      label:'官方', ic:'✦' },
  { id:'fav',      label:'收藏', ic:'♥' },
];
function buildRadial(){
  const box = $('#radial'); box.innerHTML = '';
  const n = VIEWS.length, R = 118;
  VIEWS.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'rt'; b.dataset.view = v.id;
    b.innerHTML = `<span class="ic">${v.ic}</span>${v.label}`;
    const ang = Math.PI * (1 - i / (n - 1));      // 180° → 0°，半圈
    const x = Math.cos(ang) * R, y = -Math.sin(ang) * R;
    b.dataset.tx = x.toFixed(1); b.dataset.ty = y.toFixed(1);
    b.onclick = ()=>{ showView(v.id); closeRadial(); };
    box.appendChild(b);
  });
}
function openRadial(){
  $('#radial').classList.add('on'); $('#fab').classList.add('on');
  $$('#radial .rt').forEach(b=>{
    b.style.transform = `translate(calc(-50% + ${b.dataset.tx}px), ${b.dataset.ty}px) scale(1)`;
  });
  $$('#radial .rt').forEach(b=>b.classList.toggle('on', b.dataset.view === S.view));
}
function closeRadial(){
  $('#radial').classList.remove('on'); $('#fab').classList.remove('on');
  $$('#radial .rt').forEach(b=>{ b.style.transform = 'translate(-50%,0) scale(.4)'; });
}
function toggleRadial(){ $('#radial').classList.contains('on') ? closeRadial() : openRadial(); }

function showView(v){
  if(v !== 'set') S.prevView = S.view;
  S.view = v;
  const back = $('#btnBack');
  if(back) back.style.display = v === 'set' ? 'block' : 'none';
  $$('.view').forEach(x=>x.classList.toggle('on', x.id === 'v-'+v));
  closeRadial();
  exitSel();
  if(v==='showdown') renderSd();
  if(v==='cafe') renderCf();
  if(v==='off'){ renderOffChips(); renderOff(); }
  if(v==='pmd'){ applyHanded(); renderPmdChips();
    if(!P.cur) selectPmd(S.pmd.find(m=>m.name.replace(/_$/,'')==='Pikachu') || S.pmd[0]); }
  if(v==='fav') renderFav();

/* ---------------- 精灵球：下滑藏一半 ---------------- */
function bindFabScroll(){
  let last = 0;
  const fab = $('#fab');
  const onScroll = (el)=>{
    el.addEventListener('scroll', ()=>{
      const y = el.scrollTop;
      if(y > last + 6 && y > 40){        // 往下滑 → 收起
        fab.classList.add('hide');
        closeRadial();
      } else if(y < last - 6){           // 往上滑 → 露出
        fab.classList.remove('hide');
      }
      last = y;
    }, {passive:true});
  };
  $$('.view').forEach(onScroll);
  $('#fab').addEventListener('click', ()=>fab.classList.remove('hide'), true);
}

/* ---------------- 捏合缩放调列数 ---------------- */
function setCols(n){
  n = Math.max(2, Math.min(5, n|0));
  S.cols = n;
  document.documentElement.style.setProperty('--gr', n);
  localStorage.setItem('cols', n);
  return n;
}
function bindPinchCols(){
  let d0 = 0, base = 0, active = false;
  const mark = () => {
    const t = $('#views');
    if(S.view === 'pmd'){ document.body.classList.remove('pinching'); return false; }
    document.body.classList.toggle('pinching', active);
    return true;
  };
  $('#views').addEventListener('touchstart', e=>{
    if(e.touches.length === 2 && S.view !== 'pmd'){
      active = true; base = S.cols || 3;
      d0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                      e.touches[0].clientY - e.touches[1].clientY);
      mark();
    }
  }, {passive:true});
  $('#views').addEventListener('touchmove', e=>{
    if(!active || e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    // 张开（d 变大）→ 格子更大 → 列数更少；捏合相反
    const n = Math.max(2, Math.min(5, Math.round(base * (d0 / (d || d0)))));
    if(n !== S.cols) setCols(n);
  }, {passive:false});
  const stop = ()=>{ if(active){ active = false; mark(); } d0 = 0; };
  $('#views').addEventListener('touchend', stop);
  $('#views').addEventListener('touchcancel', stop);
}

/* 分类 id → 中文名 */
function subLabel(id){
  const map = {
    'ani':'PS正面', 'ani-back':'PS背面', 'ani-shiny':'PS正面闪光', 'ani-back-shiny':'PS背面闪光',
    'gen5ani':'第5代动态', 'gen5ani-back':'第5代动态背面', 'gen5ani-shiny':'第5代动态闪光',
    'gen5ani-back-shiny':'第5代动态背面闪光',
    'icons':'图标', 'icons-shiny':'图标闪光', 'icon':'圆形图标',
    'home':'HOME', 'home-shiny':'HOME闪光', 'home-centered':'HOME居中', 'home-centered-shiny':'HOME居中闪光',
    'boxicons':'盒子图标', 'gen5Icons':'第5代图标', 'itemicons':'道具图标', 'typeicons':'属性图标',
    'types':'属性', 'categories':'分类', 'misc':'杂项', 'trainers':'训练家',
    'gen6bgs':'第6代背景', 'gen7bgs':'第7代背景', 'gen8bgs':'第8代背景', 'gen9bgs':'第9代背景',
    'afd':'四月愚人', 'afd-back':'四月愚人背面', 'afd-shiny':'四月愚人闪光',
    'afd-back-shiny':'四月愚人背面闪光', 'dex':'图鉴图', 'dex-shiny':'图鉴图闪光',
    'bwicons':'黑白图标', 'repo-extras':'仓库杂项',
  };
  if(map[id]) return map[id];
  // gen3 → 第3代 ; gen3-back → 第3代背面 ; gen3-shiny → 第3代闪光
  let m = /^gen(\d)([a-z0-9]*)(-back)?(-shiny)?$/.exec(id);
  if(m){
    const gen = m[1], vari = m[2], back = m[3], shiny = m[4];
    const vmap = { '': '', 'rb':'红蓝', 'rg':'红绿', 'rgb':'红绿蓝', 'g':'金', 's':'银', 'gs':'金银',
                   '2':'水晶', 'rs':'宝石系列', 'frlg':'火红叶绿', 'dp':'钻石珍珠', 'dp-2':'钻石珍珠2',
                   'bw':'黑白', 'b2w2':'黑2白2', 'xy':'XY', 'oras':'终极红宝石始源蓝宝石',
                   'sm':'日月', 'usum':'究极日月', 'swsh':'剑盾', 'sv':'朱紫', 'lgpe':'去皮去伊' };
    let name = '第' + gen + '代';
    if(vmap[vari] !== undefined && vari) name += vmap[vari];
    else if(vari) name += vari;
    if(back) name += '背面';
    if(shiny) name += '闪光';
    return name;
  }
  return id;
}

/* 版本比较：dev* 永远算最新，别的按 x.y.z 数值比 */
function isNewer(remote, local){
  if(!remote) return false;
  if(String(local || '').startsWith('dev')) return false;   // 开发版不弹更新
  const a = String(remote).split('.').map(Number);
  const b = String(local || '0').split('.').map(Number);
  for(let i = 0; i < Math.max(a.length, b.length); i++){
    const x = a[i] || 0, y = b[i] || 0;
    if(x > y) return true;
    if(x < y) return false;
  }
  return false;
}

      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                           e.touches[0].clientY-e.touches[1].clientY);
      zoomScale = Math.min(6, Math.max(1, startScale * d / dist0));
      zimg.style.transform = `scale(${zoomScale})`;
    }
  }, {passive:false});
  $('#zoomBody').addEventListener('touchend', e=>{
    if(swOn && e.changedTouches && e.changedTouches.length){
      const t = e.changedTouches[0];
      const dx = t.clientX - swx, dy = t.clientY - swy;
      if(Math.abs(dx) > 60 && Math.abs(dy) < 100 && zoomScale < 1.05){
        shiftZoom(dx < 0 ? 1 : -1);      // 往左滑 = 下一张
      }
    }
    swOn = false;
    if(zoomScale < 1.05){ zoomScale = 1; zimg.style.transform = 'scale(1)'; }
  });

  // 返回键：退出大图 / 退出多选
  window.addEventListener('popstate', ()=>{
    if($('#zoom').classList.contains('on')){ $('#zoom').classList.remove('on'); history.pushState(null,'',location.href); }
    else if(S.selMode){ exitSel(); history.pushState(null,'',location.href); }
  });
  history.pushState(null,'',location.href);
}

async function makeCacheRow(url){
  try{
    const r = await fetch(url); if(!r.ok) return {url, blob:null, ts:Date.now(), size:0};
    const b = await r.blob();
    return {url, blob:b, ts:Date.now(), size:b.size};
  }catch(e){ return {url, blob:null, ts:Date.now(), size:0}; }
}

/* ---------------- 启动 ---------------- */
(async function boot(){
  try{
    const savedMode = localStorage.getItem('srcMode') || 'auto';
    const mi = MODES.findIndex(m => m.id === savedMode);
    S.mode = mi >= 0 ? mi : 2;
    S.chainAt = 0;
    const cols = +localStorage.getItem('cols') || 3;
    document.documentElement.style.setProperty('--gr', cols);
    syncSrcBtn();
    setCols(parseInt(localStorage.getItem('cols') || '3', 10));

    await DB.open();
    await loadData();
    buildNameIndex();

    // 上次从 GitHub 增量下来的 Café
    try{
      const extra = JSON.parse(localStorage.getItem('cafeExtra')||'[]');
      if(extra.length){ const known=new Set(S.cafe.map(x=>x.f));
        for(const e of extra) if(!known.has(e.f)) S.cafe.push(e); }
    }catch(e){}

    await probeBridge();
    renderSdChips(); renderCfChips(); renderOffChips(); bind();
    await renderSd();
    requestAnimationFrame(pmdLoop);

    // 启动时静默检查一次更新（失败无视）
    setTimeout(()=>{ if(navigator.onLine) checkUpdate().catch(()=>{}); }, 4000);
  }catch(e){
    document.body.innerHTML = '<div style="padding:40px;color:#ff6b6b;font:14px sans-serif">'+
      '启动失败：'+e.message+'</div>';
  }
})();
</script>
