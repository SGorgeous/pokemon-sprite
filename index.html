<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12161c">
<title>PokePic</title>
<style>
  html,body{margin:0;height:100%;background:#0f1318;color:#8b98a9;
    font:14px/1.6 -apple-system,"HarmonyOS Sans","Microsoft YaHei UI",system-ui,sans-serif}
  #w{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  a{color:#4a9eff;text-decoration:none}
  .b{display:flex;gap:10px}
  .b a{padding:8px 16px;border:1px solid #2a3542;border-radius:10px;background:#1f2831;color:#e6edf5}
</style>
</head>
<body>
<div id="w">
  <div>正在选择界面…</div>
  <div class="b"><a href="mobile.html">手机版</a><a href="desktop.html">电脑版</a></div>
</div>
<script>
(function(){
  // ?ui=m / ?ui=d 可以强制；否则按 UA + 宽度判断
  var q = new URLSearchParams(location.search).get('ui');
  var target = null;
  if (q === 'm') target = 'mobile.html';
  else if (q === 'd') target = 'desktop.html';
  if (!target) {
    var ua = navigator.userAgent || '';
    var uaMobile = /Android|iPhone|iPod|iPad|Mobile|HarmonyOS|MiuiBrowser|MicroMessenger/i.test(ua);
    var coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    var narrow = window.innerWidth < 820;
    target = (uaMobile || narrow || (coarse && window.innerWidth < 1100)) ? 'mobile.html' : 'desktop.html';
  }
  location.replace(target + location.hash);
})();
</script>
</body>
</html>
